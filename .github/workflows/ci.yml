name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      # Every test runs against moto's simulated AWS: no account, no
      # credentials, nothing to clean up.
      - name: Test
        run: pytest -q
      - name: The command installs and runs
        run: aws-audit --list-checks
